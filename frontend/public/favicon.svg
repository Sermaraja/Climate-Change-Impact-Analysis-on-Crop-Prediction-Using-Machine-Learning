<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="farmBg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="20" y1="14" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="42" y1="12" x2="54" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Soft Drop Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#farmBg)" filter="url(#shadow)" />

  <!-- Subtle Sun / Climate Glow -->
  <circle cx="46" cy="18" r="5" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Agriculture Crop Sprout -->
  <!-- Left Leaf -->
  <path d="M32 46 C32 37 25 31 16 31 C16 41 23 46 32 46 Z" fill="url(#leafGrad)" />
  <!-- Right Main Leaf -->
  <path d="M32 46 C32 31 43 20 50 18 C50 29 42 42 32 46 Z" fill="url(#leafGrad)" />
  <!-- Center Stem & Soil Base -->
  <path d="M32 48 L32 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M22 51 C27 49.5 37 49.5 42 51" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>